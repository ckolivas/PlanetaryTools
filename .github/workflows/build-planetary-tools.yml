name: Build and Release Planetary Tools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild and upload (leave blank for build only)'
        required: false
        type: string

permissions:
  contents: write          # <-- This fixes the 403 error

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: planetary-tools
            asset: planetary-tools-linux
          - os: windows-latest
            binary: planetary-tools.exe
            asset: planetary-tools-windows.exe
          - os: macos-15
            binary: Planetary Tools.app/Contents/MacOS/planetary-tools
            asset: planetary-tools-macos-arm64.zip
            architecture: arm64
          - os: macos-15-intel
            binary: Planetary Tools.app/Contents/MacOS/planetary-tools
            asset: planetary-tools-macos-intel.zip
            architecture: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the current workflow to repair a release without moving its tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      # Rebuilding an older release uses that tag's app code with this workflow's
      # packaging and validators, including the Mac bundle and both architectures.
      - name: Checkout current packaging for a release rebuild
        if: inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-packaging
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /planetary-app/planetary-tools.spec
            /planetary-app/scripts/

      - name: Apply current packaging to the selected release
        if: inputs.release_tag != ''
        shell: python
        run: |
          from pathlib import Path
          import shutil
          source = Path('.release-packaging/planetary-app')
          target = Path('planetary-app')
          shutil.copy2(source / 'planetary-tools.spec', target / 'planetary-tools.spec')
          for name in ('check_packaged_media.py', 'check_packaged_macos.py'):
              shutil.copy2(source / 'scripts' / name, target / 'scripts' / name)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies
        working-directory: planetary-app
        run: |
          pip install --only-binary=av -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        working-directory: planetary-app
        run: pyinstaller --clean --noconfirm planetary-tools.spec

      - name: Test bundled interpolation and MP4 without external FFmpeg
        if: runner.os != 'macOS'
        working-directory: planetary-app
        run: python scripts/check_packaged_media.py "dist/${{ matrix.binary }}"

      - name: Prepare executable for release
        if: runner.os != 'macOS'
        working-directory: planetary-app
        shell: bash
        run: cp "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Package Mac application
        if: runner.os == 'macOS'
        working-directory: planetary-app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Planetary Tools.app" "dist/${{ matrix.asset }}"

      - name: Test extracted Mac app and Finder launch
        if: runner.os == 'macOS'
        working-directory: planetary-app
        run: python scripts/check_packaged_macos.py "dist/${{ matrix.asset }}" --architecture "${{ matrix.architecture }}"

      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: planetary-app/dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: planetary-app/dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
